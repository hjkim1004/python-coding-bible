<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python 코딩 바이블</title>
    <!-- Pretendard Web Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    
    <!-- 🚨 초정밀 글로벌 브라우저 에러 캡처 스크립트 -->
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.height = '100%';
        errorDiv.style.backgroundColor = '#fef2f2';
        errorDiv.style.color = '#991b1b';
        errorDiv.style.padding = '24px';
        errorDiv.style.fontFamily = 'monospace';
        errorDiv.style.zIndex = '999999';
        errorDiv.style.overflow = 'auto';
        
        errorDiv.innerHTML = `
          <h1 style="font-size: 24px; margin-bottom: 16px; font-weight: bold;">🚨 브라우저 런타임 에러 감지</h1>
          <p style="font-size: 16px; font-weight: bold; margin-bottom: 8px;">${message}</p>
          <p style="color: #4b5563;">Source: ${source} (Line: ${lineno}, Col: ${colno})</p>
          <pre style="margin-top: 16px; background-color: #fee2e2; padding: 16px; border-radius: 8px; border: 1px solid #fca5a5;">${error ? error.stack : 'No stack trace available'}</pre>
        `;
        document.body.appendChild(errorDiv);
        return false;
      };

      window.addEventListener('unhandledrejection', function(event) {
        var errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.height = '100%';
        errorDiv.style.backgroundColor = '#fef2f2';
        errorDiv.style.color = '#991b1b';
        errorDiv.style.padding = '24px';
        errorDiv.style.fontFamily = 'monospace';
        errorDiv.style.zIndex = '999999';
        errorDiv.style.overflow = 'auto';
        
        errorDiv.innerHTML = `
          <h1 style="font-size: 24px; margin-bottom: 16px; font-weight: bold;">🚨 비동기 프로미스 거부 (Unhandled Rejection)</h1>
          <p style="font-size: 16px; font-weight: bold; margin-bottom: 8px;">${event.reason ? event.reason.message : 'Unknown promise rejection'}</p>
          <pre style="margin-top: 16px; background-color: #fee2e2; padding: 16px; border-radius: 8px; border: 1px solid #fca5a5;">${event.reason && event.reason.stack ? event.reason.stack : 'No stack trace available'}</pre>
        `;
        document.body.appendChild(errorDiv);
      });
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-brand-850 text-slate-800 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
